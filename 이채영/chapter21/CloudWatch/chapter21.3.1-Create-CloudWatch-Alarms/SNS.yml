AWSTemplateFormatVersion: "2010-09-09"
Description: Create SNS Topic
# ------------------------------------------------------------#
# Input Parameters
# ------------------------------------------------------------#
Parameters:
  SystemName:
    Description: "System name of each resource names."
    Type: String
    Default: "gr"
  EnvName:
    Description: "Environment name of each resource names."
    Type: String
    Default: "product"

# ------------------------------------------------------------#
#  Create sns Topic
# ------------------------------------------------------------#
Resources:
  MySNSTopic:
    Type: AWS::SNS::Topic # 이메일로 통지를 받는 데 아마존 SNS 사용
    Properties:
      TopicName: !Sub ${SystemName}-${EnvName}-sns
      Subscription: # 이메일 인증 필요
        - Endpoint: # 통지 받을 이메일 입력
          Protocol: email

# ------------------------------------------------------------
# Output Parameters
# ------------------------------------------------------------
Outputs:
  # SNS
  SNS:
    Value: !Ref MySNSTopic
    Export:
      Name: !Sub ${EnvName}-sns