AWSTemplateFormatVersion: "2010-09-09"
Description: Create EC2
# ------------------------------------------------------------#
# Input Parameters
# ------------------------------------------------------------#
Parameters:
  SystemName:
    Description: "System name of each resource names."
    Type: String
    Default: "gr"
  EnvName:
    Description: "Environment name of each resource names."
    Type: String
    Default: "product"
  KeyPairName: # 키 페어 이름 지정
    Description: gr-product-ec2 EC2 Key Pair
    Type: String
    Default: gr-product-ec2-key
  EC2AMI: # AMI 지정
    Description: gr-product-ec2 EC2 AMI
    Type: String
    Default: ami-02d081c743d676996
  InstanceType: # 인스턴스 유형 지정
    Description: gr-product-ec2 EC2 instance type
    Type: String
    Default: t3.micro
# ------------------------------------------------------------#
#  Create EC2 Instance
# ------------------------------------------------------------#
Resources:
  NewKeyPair:
    Type: AWS::EC2::KeyPair # EC2 인스턴스 키 페어 생성
    Properties:
      KeyName: !Ref KeyPairName
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties: # EC2 인스턴스 속성 설정
      ImageId: !Ref EC2AMI # AMI 지정을 위한 ImageId
      InstanceType: !Ref InstanceType # 인스턴스 유형 지정을 위한 InstanceType
      KeyName: !Ref NewKeyPair # 키 페어 사용을 위한 KeyName
      NetworkInterfaces: # EC2 인스턴스의 네트워크 설정
        - DeviceIndex: 0
          SubnetId: { "Fn::ImportValue": !Sub "${EnvName}-public-subnet-1a" }
          GroupSet:
            - Fn::ImportValue: !Sub ${EnvName}-ec2-sg
          AssociatePublicIpAddress: true # 인터넷 게이트웨이를 통해 EC2 인스턴스 접속 -> AssociatePublicAddress을 이용해 퍼블릭 IP 주소 할당
      BlockDeviceMappings: # EBS 볼륨 사용
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            Encrypted : true
      Tags:
        - Key: Name
          Value: !Sub ${SystemName}-${EnvName}-ec2
        - Key: Env
          Value: !Sub ${EnvName}
# ------------------------------------------------------------
# Output Parameters
# ------------------------------------------------------------
Outputs:
  # EC2
  EC2Instance:
    Value: !Ref EC2Instance
    Export:
      Name: !Sub ${EnvName}-ec2